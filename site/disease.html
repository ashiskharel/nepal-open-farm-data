<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#114627">
  <title>Verify diseases — Nepal field desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23114627' width='16' height='16' rx='2'/%3E%3Cpath fill='%23f3ecdf' d='M8 13c0-4 3-5 3-8-2 1-3 3-3 4 0-3-2-4-4-4 1 3 2 4 4 8z'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="app">
  <a class="skip" href="#check">Skip to the check</a>
  <header class="appbar">
    <p class="app-kicker"><a href="./index.html">Nepal field desk</a></p>
    <h1>Verify diseases</h1>
    <p class="lede">Tick what you can see. The note is a field check. A disease name is not read from the photo.</p>
  </header>
  <main id="check">
    <p id="status" role="status">Loading…</p>
    <p id="place-line"></p>
    <p id="chemical-note"></p>
    <form id="photo-form">
      <label>Crop
        <select id="photo-crop"></select>
      </label>
      <label>What the picture shows
        <select id="photo-place">
          <option value="leaf">A leaf or a fruit, up close</option>
          <option value="bed">The bed or the tree</option>
          <option value="water">The water source</option>
          <option value="path">The path</option>
          <option value="other">Something else</option>
        </select>
      </label>
      <fieldset>
        <legend>What you can see</legend>
        <div id="symptoms"></div>
      </fieldset>
      <label>Note
        <textarea id="photo-note" maxlength="500"></textarea>
      </label>
      <label>Photo · फोटो
        <input id="photo-file" type="file" accept="image/*" capture="environment">
      </label>
      <button type="submit">Save photo on this phone</button>
    </form>
    <p id="photo-count"></p>
    <button type="button" id="send-pack">Send this check<br>पठाउनुहोस्</button>
    <div id="gallery"></div>
  </main>
  <footer>
    <p>Local chemical: none listed. Read the label and ask a technician. <a href="https://github.com/ashiskharel/nepal-open-farm-data">Source repository</a>.</p>
  </footer>
  <nav class="dock" aria-label="Desk">
    <a href="./index.html">Home</a>
    <a href="./land.html">Land</a>
    <a href="./disease.html" aria-current="page">Disease</a>
    <a href="./book.html">Yield</a>
    <a href="./indoor.html">Indoor</a>
  </nav>
  <script type="module" src="./js/disease.js"></script>
</body>
</html>
